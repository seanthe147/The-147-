  "@tailwindcss/oxide>@tailwindcss/oxide-linux-x64-musl": "-"
  "rollup>@rollup/rollup-android-arm-eabi": "-"
  "rollup>@rollup/rollup-android-arm64": "-"
  "rollup>@rollup/rollup-darwin-arm64": "-"
  "rollup>@rollup/rollup-darwin-x64": "-"
  "rollup>@rollup/rollup-freebsd-arm64": "-"
  "rollup>@rollup/rollup-freebsd-x64": "-"
  "rollup>@rollup/rollup-linux-arm-gnueabihf": "-"
  "rollup>@rollup/rollup-linux-arm-musleabihf": "-"
  "rollup>@rollup/rollup-linux-arm64-gnu": "-"
  "rollup>@rollup/rollup-linux-arm64-musl": "-"
  "rollup>@rollup/rollup-linux-loong64-gnu": "-"
  "rollup>@rollup/rollup-linux-loong64-musl": "-"
  "rollup>@rollup/rollup-linux-ppc64-gnu": "-"
  "rollup>@rollup/rollup-linux-ppc64-musl": "-"
  "rollup>@rollup/rollup-linux-riscv64-gnu": "-"
  "rollup>@rollup/rollup-linux-riscv64-musl": "-"
  "rollup>@rollup/rollup-linux-s390x-gnu": "-"
  "rollup>@rollup/rollup-linux-x64-musl": "-"
  "rollup>@rollup/rollup-openbsd-x64": "-"
  "rollup>@rollup/rollup-openharmony-arm64": "-"
  "rollup>@rollup/rollup-win32-arm64-msvc": "-"
  "rollup>@rollup/rollup-win32-ia32-msvc": "-"
  "rollup>@rollup/rollup-win32-x64-gnu": "-"
  "rollup>@rollup/rollup-win32-x64-msvc": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-x64": "-"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # Security: esbuild <=0.27.7 has RCE via NPM_CONFIG_REGISTRY (GHSA-gv7w-rqvm-qjhr, High) + arbitrary file read (GHSA-g7r4-m6w7-qqqr, Low)
  # Affected reported versions: 0.25.12, 0.27.7 — override forces all dependents to 0.28.1+
  esbuild: "0.28.1"
  # Security: uuid <11.1.1 has missing buffer bounds check (GHSA-w5hq-g745-h8pq)
  uuid: "^11.1.1"
  # Security: qs >=6.11.1 <=6.15.1 has DoS via qs.stringify (GHSA-q8mj-m7cp-5q26)
  qs: "^6.15.2"
  # Security: postcss <8.5.10 has XSS via unescaped </style> (GHSA-qx2v-qp2m-jg93)
  postcss: ">=8.5.23"
  # Security: vite >=7.0.0 <=7.3.4 has server.fs.deny bypass (GHSA-fx2h-pf6j-xcff, High) + NTLMv2 hash disclosure (GHSA-v6wh-96g9-6wx3, Medium)
  # Affected reported version: 7.3.3 — override forces all dependents to 7.3.5+
  vite: ">=7.3.5"
  # Security: @xmldom/xmldom <0.8.13 has multiple XML injection/DoS CVEs (GHSA-2v35-w6hq-6mfw, GHSA-f6ww-3ggp-fr8h, GHSA-j759-j44w-7fr8, GHSA-wh4c-j3r5-mjhp, GHSA-x6wf-f3px-wcqx, all High)
  # Affected reported version: 0.7.13 — override forces all dependents to 0.8.13+
  "@xmldom/xmldom": ">=0.8.13"
  "@expo/plist>@xmldom/xmldom": "0.8.13"
  # Security: js-yaml <=4.1.1 has quadratic-complexity DoS in merge key handling (GHSA-h67p-54hq-rp68, Medium)
  # Affected reported versions now include 4.2.0 — override forces all dependents to the patched 4.3.0+
  js-yaml: ">=4.3.0"
  # Security: brace-expansion has multiple resource-exhaustion vulnerabilities across maintained major lines.
  # Keep each dependent on its existing major while forcing the patched release for that line.
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  # Security: tar 7.5.13 has path traversal and denial-of-service vulnerabilities.
  tar: ">=7.5.21"
  # image-size has no patched release. Metro 0.83 requires the 1.x Buffer API;
  # 2.x crashes while reading Expo assets. The unpatched CVEs are narrowly
  # accepted above because Metro only reads trusted repository assets at build time.
  image-size: "1.2.1"
  # Security: http-proxy-middleware 3.0.5 mishandles crafted proxy requests.
  http-proxy-middleware: ">=3.0.7"
  # Expo Launch currently exports iOS with Node 20.19.4. Undici 8 requires
  # Node 22 WebIDL APIs and crashes before Metro starts, so keep all consumers
  # on the latest Node-20-compatible major.
  undici: "7.29.0"
  # Security: body-parser 2.2.2 can silently disable request-size limits.
  body-parser: ">=2.3.0"
  # Security: linkify-it 5.0.1 has a regular-expression denial of service.
  linkify-it: ">=5.0.2"
  # Security: fast-uri <3.1.5 has URL canonicalization and denial-of-service vulnerabilities.
  fast-uri: ">=3.1.5"
  # Security: nanoid <3.3.18 has predictable output and denial-of-service vulnerabilities.
  nanoid: ">=3.3.18"
  # Security: markdown-it <=14.1.1 has quadratic DoS in smartquotes rule (GHSA-6v5v-wf23-fmfq, Medium)
  # Affected reported version: 14.1.1 — override forces all dependents to 14.2.0+
  markdown-it: ">=14.2.0"
  # Security: @opentelemetry/core <2.8.0 has unbounded memory allocation in W3C Baggage propagation (GHSA-8988-4f7v-96qf, Medium)
  # Affected reported versions: 2.6.1, 2.7.1 — override forces all dependents to 2.8.0+
  "@opentelemetry/core": ">=2.8.0"
  # Security: @babel/core <=7.29.0 has arbitrary file read via sourceMappingURL comment (GHSA-4x5r-pxfx-6jf8, Low)
  # Affected reported versions: 7.28.6, 7.29.0 — override forces all dependents to 7.29.6+
  "@babel/core": ">=7.29.6"
  # Security: shell-quote <=1.8.3 has ReDoS / argument injection (GHSA-w7jw-789q-3m8p, High)
  # Affected reported versions now include 1.8.4 — override forces all dependents to 1.9.0+
  shell-quote: ">=1.9.0"
