packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# The node-forge CVE is fixed by the tested local patch below, not accepted
# as an exploitable risk. See docs/dependency-security.md; review by 2026-11-23.
auditConfig:
  ignoreCves:
    - CVE-2026-85393

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.7
  wouter: ^3.3.5
  zod: ^3.25.76

# Supply-chain protection: do not disable the one-day minimum release age.
# Exceptions must remain scoped to trusted packages and exact versions.
# Supply-chain protection: retain the one-day minimum release age.
# Exclusions must stay scoped to trusted packages and exact versions.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync
  - expo@57.0.31 || 57.0.33
  - expo-constants@57.0.22 || 57.0.24
  - expo-linking@57.0.13 || 57.0.14
  - expo-router@57.0.29 || 57.0.31
  - expo-updates@57.0.28
  - '@expo/fingerprint@0.20.16'
  - '@expo/metro-file-map@57.0.5'
  - '@expo/cli@57.0.32 || 57.0.34'
  - '@expo/router-server@57.0.14'
  - '@expo/config-plugins@57.0.11 || 57.0.13'
  - '@expo/prebuild-config@57.0.19 || 57.0.21'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.26'
  - expo-modules-autolinking@57.0.16 || 57.0.18
  - expo-modules-core@57.0.24 || 57.0.26
  - expo-modules-jsi@57.1.3
  - expo-asset@57.0.20 || 57.0.21
  - expo-location@57.0.22
  - babel-preset-expo@57.0.16 || 57.0.17

