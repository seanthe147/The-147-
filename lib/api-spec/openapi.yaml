openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /membership/enable-auto-renew:
    post:
      operationId: enableMembershipAutoRenew
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipAutoRenew" }
      responses:
        "200":
          description: Customer-authorised billing begins after prepaid access; no charge today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
        "400": { description: Fresh STORE verification and consent required }
        "409": { description: Renewal could not be safely scheduled; prepaid access unchanged }
  /staff/membership/pos-catalog:
    get:
      operationId: getMembershipPosCatalog
      responses:
        "200":
          description: Exact till variations available for manager mapping
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipPosItem" }
        "403": { description: Manager access required }
        "502": { description: Square catalogue unavailable }
  /staff/membership/pos-purchases:
    get:
      operationId: getMembershipPosPurchases
      responses:
        "200":
          description: Last 100 prepaid receipt matching/review outcomes
          content:
            application/json:
              schema:
                type: object
                required: [purchases]
                properties:
                  purchases:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipPosPurchase" }
        "403": { description: Manager access required }
  /staff/membership/pos-purchases/import:
    post:
      operationId: importMembershipPosPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPosImport" }
      responses:
        "200":
          description: Paid receipt imported idempotently without creating a charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
        "403": { description: Manager access required }
        "409": { description: Receipt or customer matching needs review }
  /staff/membership/pos-purchases/{id}/retry:
    post:
      operationId: retryMembershipPosPurchase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Existing prepaid evidence matched without another charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
        "403": { description: Manager access required }
        "409": { description: Verified customer or billing review still needed }
  /staff/membership/subscriptions/{id}/billing:
    get:
      operationId: getStaffMembershipBilling
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Manager-only central membership billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipBilling" }
        "403": { description: Manager access required }
        "503": { description: Square billing could not be verified }
  /staff/membership/subscriptions/{id}/change-plan:
    post:
      operationId: changeStaffMembershipPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffMembershipChange" }
      responses:
        "200":
          description: Customer-authorised change confirmed by Square for next renewal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
        "403": { description: Manager access required }
        "409": { description: Change blocked or not confirmed by Square }
  /staff/membership/subscriptions/{id}/cancel:
    post:
      operationId: cancelStaffMembershipBilling
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipCancellation" }
      responses:
        "200":
          description: Term-compliant cancellation confirmed by Square; paid access retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
        "403": { description: Manager access required }
        "409": { description: Cancellation blocked or not confirmed by Square }
  /membership/payment-card:
    post:
      operationId: replaceMembershipCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipCardReplacement" }
      responses:
        "200":
          description: Existing subscription card updated without changing billing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
  /membership/billing:
    get:
      operationId: getMembershipBilling
      responses:
        "200":
          description: Shared membership billing dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipBilling" }
  /membership/reactivate:
    post:
      operationId: reactivateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipReactivation" }
      responses:
        "201":
          description: Reactivation submitted to Square; access remains pending until payment confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
  /membership/change-plan:
    post:
      operationId: changeMembershipPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipChange" }
      responses:
        "200":
          description: Plan change scheduled for renewal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
  /membership/cancel:
    post:
      operationId: cancelMembershipBilling
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipCancellation" }
      responses:
        "200":
          description: Cancellation scheduled at the end of the billing period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
  /membership/undo-cancel:
    post:
      operationId: undoScheduledMembershipCancellation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipCancellation" }
      responses:
        "200":
          description: Scheduled cancellation removed without changing paid access or billing dates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
  /staff/wix-migration/{id}/review:
    post:
      operationId: reviewMembershipMigration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipMigrationReview" }
      responses:
        "200":
          description: Legacy billing verified stopped and replacement start date recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipActionResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MembershipPosImport:
      type: object
      additionalProperties: false
      required: [orderId]
      properties:
        orderId: { type: string, minLength: 1, maxLength: 192, pattern: "^[A-Za-z0-9_-]+$" }
    MembershipAutoRenew:
      type: object
      additionalProperties: false
      required: [billingFrequency, termsAccepted, sourceId, verificationToken]
      properties:
        billingFrequency: { type: string, enum: [monthly, annual] }
        termsAccepted: { type: boolean }
        minimumTermAccepted: { type: boolean }
        sourceId: { type: string, minLength: 1, maxLength: 256 }
        verificationToken: { type: string, minLength: 1, maxLength: 2048 }
    MembershipPosItem:
      type: object
      required: [variationId, itemName, variationName, pricePence, currency]
      properties:
        variationId: { type: string }
        itemName: { type: string }
        variationName: { type: string }
        pricePence: { type: ["integer", "null"] }
        currency: { type: ["string", "null"] }
    MembershipPosPurchase:
      type: object
      required: [id, planName, purchasedAt, periodEnd, status, reviewReason, customerMatched]
      properties:
        id: { type: string }
        planName: { type: string }
        purchasedAt: { type: ["string", "null"], format: date-time }
        periodEnd: { type: ["string", "null"] }
        status: { type: string }
        reviewReason: { type: ["string", "null"] }
        customerMatched: { type: boolean }
    MembershipBilling:
      type: object
      required: [subscription, plans, reactivation]
      properties:
        subscription:
          anyOf:
            - { $ref: "#/components/schemas/MembershipBillingSubscription" }
            - { type: "null" }
        plans:
          type: array
          items: { $ref: "#/components/schemas/MembershipBillingPlan" }
        reactivation:
          anyOf:
            - { $ref: "#/components/schemas/MembershipReactivationOffer" }
            - { type: "null" }
    MembershipReactivationOffer:
      type: object
      required: [available, planId, planName, frequency, pricePence, minimumTermMonths, paidThroughDate, deadline]
      properties:
        available: { type: boolean }
        planId: { type: integer }
        planName: { type: string }
        frequency: { type: string, enum: [monthly, annual] }
        pricePence: { type: integer }
        minimumTermMonths: { type: integer }
        paidThroughDate: { type: string, format: date }
        deadline: { type: string, format: date }
    MembershipBillingPlan:
      type: object
      required: [id, name, tier, monthlyPence, annualPence, minimumTermMonths]
      properties:
        id: { type: integer }
        name: { type: string }
        tier: { type: string }
        monthlyPence: { type: integer }
        annualPence: { type: ["integer", "null"] }
        minimumTermMonths: { type: integer }
    MembershipBillingSubscription:
      type: object
      required: [id, planId, planName, currentTier, currentMonthlyPence, frequency, status, renewalDate, commitmentEndDate, cancellationAllowed, cancellationReversible, pendingPlanName, pendingDate, cancellationDate, managedInSquare, migrationNeedsReview]
      properties:
        id: { type: integer }
        planId: { type: integer }
        planName: { type: string }
        currentTier: { type: ["string", "null"] }
        currentMonthlyPence: { type: ["integer", "null"] }
        source: { type: string }
        frequency: { type: string, enum: [monthly, annual] }
        status: { type: string }
        renewalDate: { type: ["string", "null"] }
        firstPaidAt: { type: ["string", "null"], format: date-time }
        lastPaidAt: { type: ["string", "null"], format: date-time }
        prepaidUntilDate: { type: ["string", "null"] }
        autoRenewEligible: { type: boolean }
        autoRenewScheduled: { type: boolean }
        autoRenewStartDate: { type: ["string", "null"] }
        commitmentEndDate: { type: ["string", "null"] }
        cancellationAllowed: { type: boolean }
        cancellationReversible: { type: boolean }
        pendingPlanName: { type: ["string", "null"] }
        pendingDate: { type: ["string", "null"] }
        cancellationDate: { type: ["string", "null"] }
        managedInSquare: { type: boolean }
        migrationNeedsReview: { type: boolean }
        cardReplacementAllowed: { type: boolean }
        paymentCard:
          anyOf:
            - { $ref: "#/components/schemas/MembershipPaymentCard" }
            - { type: "null" }
    MembershipPaymentCard:
      type: object
      required: [brand, last4, expiryMonth, expiryYear]
      properties:
        brand: { type: ["string", "null"] }
        last4: { type: ["string", "null"] }
        expiryMonth: { type: ["integer", "null"] }
        expiryYear: { type: ["integer", "null"] }
    MembershipCardReplacement:
      type: object
      additionalProperties: false
      required: [sourceId, verificationToken, authorised]
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 256 }
        verificationToken: { type: string, minLength: 1, maxLength: 2048 }
        authorised: { type: boolean }
    StaffMembershipChange:
      type: object
      additionalProperties: false
      required: [planId, billingFrequency, termsAccepted, customerAuthorised]
      properties:
        planId: { type: integer, minimum: 1 }
        billingFrequency: { type: string, enum: [monthly, annual] }
        termsAccepted: { type: boolean }
        customerAuthorised: { type: boolean }
    MembershipChange:
      type: object
      required: [planId, billingFrequency, termsAccepted]
      properties:
        planId: { type: integer }
        billingFrequency: { type: string, enum: [monthly, annual] }
        termsAccepted: { type: boolean }
    MembershipCancellation:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
    MembershipReactivation:
      type: object
      additionalProperties: false
      required: [planId, billingFrequency, termsAccepted, sourceId, verificationToken]
      properties:
        planId: { type: integer, minimum: 1 }
        billingFrequency: { type: string, enum: [monthly, annual] }
        termsAccepted: { type: boolean }
        minimumTermAccepted: { type: boolean }
        sourceId: { type: string, minLength: 1, maxLength: 256 }
        verificationToken: { type: string, minLength: 1, maxLength: 2048 }
    MembershipMigrationReview:
      type: object
      required: [legacyBillingStopped, paidThroughDate]
      properties:
        legacyBillingStopped: { type: boolean }
        paidThroughDate: { type: string, format: date }
    MembershipActionResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
        effectiveDate: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

